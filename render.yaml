# Render Blueprint — deploy via: Render dashboard → New + → Blueprint →
# select this repo. Creates the API service and its Postgres database
# together, and auto-wires DATABASE_URL between them.
#
# Note: Render's free Postgres plan is time-limited (check Render's current
# pricing page) — upgrade the database plan before that if you need this
# data to persist long-term.

services:
  - type: web
    name: website-offer-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: website-offer-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://website-offer.manojrashinkar.com
      - key: RATE_LIMIT_MAX_SUBMISSIONS
        value: "5"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "60"
      - key: DUPLICATE_WINDOW_HOURS
        value: "24"
      - key: BUSINESS_NAME
        value: ""
      - key: CONTACT_EMAIL
        value: ""
      - key: CONTACT_PHONE
        value: ""
      - key: BUSINESS_LOCATION
        value: ""

databases:
  - name: website-offer-db
    plan: free
