<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport instead of sliding it upward, so fixed elements
         (the assistant sheet, the sticky bar) stay where they are put. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Professional Business Website Development | Website Offer</title>
    <meta
      name="description"
      content="Apply for a professional, mobile-responsive business website with WhatsApp integration, enquiry forms and deployment support. A limited introductory programme — selected businesses may qualify for reduced development charges."
    />
    <link rel="canonical" href="https://website-offer.manojrashinkar.com/" />

    <!-- Sets the theme before first paint. Running this from React would show
         a light flash on every load for anyone using the dark theme. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wo_theme');
          var dark = saved === 'dark'
            || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* Blocked storage just means the light theme is used. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (WhatsApp / LinkedIn preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Professional Business Website Development" />
    <meta
      property="og:description"
      content="Apply for a professional, mobile-responsive business website with WhatsApp integration, enquiry forms and deployment support."
    />
    <meta property="og:url" content="https://website-offer.manojrashinkar.com/" />
    <meta property="og:site_name" content="Business Websites" />
    <!-- TODO: drop a real 1200x630 image at frontend/public/og-image.png — until
         then this points at a file that doesn't exist yet, so WhatsApp/LinkedIn
         shares will show no preview thumbnail (falls back gracefully, just plain). -->
    <meta property="og:image" content="https://website-offer.manojrashinkar.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Professional Business Website Development" />
    <meta
      name="twitter:description"
      content="Apply for a professional, mobile-responsive business website with WhatsApp integration, enquiry forms and deployment support."
    />
    <meta name="twitter:image" content="https://website-offer.manojrashinkar.com/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Business Websites",
      "description": "Professional business website design and development, including mobile-responsive design, enquiry forms, WhatsApp integration and deployment support.",
      "url": "https://website-offer.manojrashinkar.com/",
      "serviceType": "Business website design and development"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
