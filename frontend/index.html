<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_SEO_TITLE%</title>
    <meta name="description" content="%VITE_SEO_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_DOMAIN%%VITE_OFFER_ROUTE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (WhatsApp / LinkedIn preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_SEO_TITLE%" />
    <meta property="og:description" content="%VITE_SEO_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_DOMAIN%%VITE_OFFER_ROUTE%" />
    <meta property="og:image" content="%VITE_SITE_DOMAIN%%VITE_OG_IMAGE_URL%" />
    <meta property="og:site_name" content="%VITE_SEO_TITLE%" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SEO_TITLE%" />
    <meta name="twitter:description" content="%VITE_SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_DOMAIN%%VITE_OG_IMAGE_URL%" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "%VITE_SEO_TITLE%",
      "description": "%VITE_SEO_DESCRIPTION%",
      "url": "%VITE_SITE_DOMAIN%%VITE_OFFER_ROUTE%",
      "email": "%VITE_CONTACT_EMAIL%",
      "telephone": "%VITE_CONTACT_PHONE%",
      "areaServed": "%VITE_BUSINESS_LOCATION%",
      "serviceType": "Business website design and development"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
